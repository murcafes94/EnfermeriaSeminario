name: Generar Linux y Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Instalar bibliotecas gráficas Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-shape0 libxcb-util1 libxcb-image0 libxkbcommon-x11-0
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Comprobar datos, controles y exportaciones
        run: python -m unittest discover -s tests -v
      - name: Generar aplicación
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name EnfermeriaSeminario --icon assets/app_icon.png --add-data "assets:assets" --collect-data reportlab --exclude-module numpy --paths src run.py
          cp scripts/install_linux.sh dist/EnfermeriaSeminario/Instalar_en_menu_de_aplicaciones.sh
          cp scripts/uninstall_linux.sh dist/EnfermeriaSeminario/Desinstalar_del_menu.sh
          cp scripts/open_linux.sh dist/EnfermeriaSeminario/Abrir_Enfermeria.sh
          cp assets/app_icon.png dist/EnfermeriaSeminario/app_icon.png
          chmod +x dist/EnfermeriaSeminario/EnfermeriaSeminario dist/EnfermeriaSeminario/*.sh
      - name: Verificar ventana principal empaquetada
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 30s dist/EnfermeriaSeminario/EnfermeriaSeminario --main --smoke-test
      - name: Generar paquete Linux
        run: |
          mkdir -p dist/entrega-linux
          tar -C dist -czf dist/entrega-linux/Enfermeria-Linux-x86_64-3.7.0.tar.gz EnfermeriaSeminario
          cp LEEME_v3.7.0.md dist/entrega-linux/
          cd dist/entrega-linux
          sha256sum Enfermeria-Linux-x86_64-3.7.0.tar.gz LEEME_v3.7.0.md > SHA256SUMS.txt
      - name: Descargar resultados Linux
        uses: actions/upload-artifact@v6
        with:
          name: Enfermeria-Linux-v3.7.0
          path: dist/entrega-linux/
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Comprobar datos, controles y exportaciones
        run: python -m unittest discover -s tests -v
      - name: Generar aplicación
        run: python -m PyInstaller --noconfirm --clean --windowed --name EnfermeriaSeminario --icon assets/app_icon.ico --version-file scripts/version_info.txt --add-data "assets;assets" --collect-data reportlab --exclude-module numpy --paths src run.py
      - name: Verificar ventana principal empaquetada
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process dist/EnfermeriaSeminario/EnfermeriaSeminario.exe -ArgumentList '--main','--smoke-test' -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'La prueba de inicio agotó el tiempo.' }
          if ($process.ExitCode -ne 0) { throw "Falló el inicio: $($process.ExitCode)" }
      - name: Generar instalador y portable
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'No se encontró Inno Setup en el equipo Windows.' }
          & $compiler scripts/installer_windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falló la creación del instalador.' }
          New-Item -ItemType Directory -Force dist/entrega | Out-Null
          Copy-Item dist/installer/*.exe dist/entrega/
          Compress-Archive -Path dist/EnfermeriaSeminario -DestinationPath dist/entrega/Enfermeria-Windows-Portable-3.7.0.zip
          Copy-Item LEEME_v3.7.0.md dist/entrega/
          Get-ChildItem dist/entrega -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/entrega/SHA256SUMS.txt
      - name: Descargar resultados
        uses: actions/upload-artifact@v6
        with:
          name: Enfermeria-Windows-v3.7.0
          path: dist/entrega/
          if-no-files-found: error
          retention-days: 14

